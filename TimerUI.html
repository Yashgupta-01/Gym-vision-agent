<!-- Micro-Interactions Script for Stepper & Rest Timer -->
<script>
    let remainingSeconds = 105; // 01:45
    const countdownEl = document.getElementById('countdownDisplay');
    const subBtn = document.getElementById('subRestBtn');
    const addBtn = document.getElementById('addRestBtn');

    function updateDisplay() {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      countdownEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    if (subBtn && addBtn && countdownEl) {
      subBtn.addEventListener('click', () => {
        remainingSeconds = Math.max(0, remainingSeconds - 10);
        updateDisplay();
      });

      addBtn.addEventListener('click', () => {
        remainingSeconds += 10;
        updateDisplay();
      });

      // Subtle simulated countdown ticks
      setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateDisplay();
        }
      }, 1000);
    }
  </script>
